# Configuração de build para Railway (Nixpacks)
# Compila o frontend e instala o backend em um único serviço.

[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
cmds = [
  "pip install -r backend/requirements.txt",
  "cd frontend && npm ci && npm run build",
]

[start]
cmd = "cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 3 --threads 4 --timeout 60"
